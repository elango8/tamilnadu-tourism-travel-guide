<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tamil Nadu Tourism</title>
    <meta name="description" content="Login to Tamil Nadu Tourism - Your smart, real-time travel companion.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>
    <div class="login-page">
        <div class="login-container">
            <!-- Left Image -->
            <div class="login-image">
                <img src="https://images.unsplash.com/photo-1768843883463-4c64257c830b?w=800&q=80"
                    alt="Tamil Nadu Temple">
                <div class="login-image-overlay">
                    <div>
                        <h3>Discover Tamil Nadu</h3>
                        <p>AI-powered travel companion for safe, confident journeys</p>
                    </div>
                </div>
            </div>

            <!-- Login Form -->
            <div class="login-form-container">
                <div class="login-header">
                    <div class="login-brand">
                        <a href="login.html">
                            <img src="images/tn-logo.png" alt="Tamil Nadu Tourism" class="login-logo-img">
                        </a>
                    </div>
                    <div class="login-welcome">
                        <h2>Welcome, Tourist!</h2>
                        <p>Sign in to explore Tamil Nadu</p>
                    </div>
                </div>

                <form class="login-form" onsubmit="handleTouristLogin(event)">
                    <div class="form-group">
                        <label>Email or Phone</label>
                        <div class="input-group">
                            <svg class="input-icon icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                            </svg>
                            <input type="text" class="input" placeholder="Enter your email or phone" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-group">
                            <svg class="input-icon icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" class="input" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg">
                        <span>Sign In as Tourist</span>
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" x2="3" y1="12" y2="12"></line>
                        </svg>
                    </button>
                </form>

                <div class="form-divider">
                    <div class="form-divider-line"></div>
                    <span class="form-divider-text">Or continue with</span>
                    <div class="form-divider-line"></div>
                </div>

                <button class="google-btn" onclick="handleGoogleLogin()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    <span>Sign in with Google</span>
                </button>

                <div class="form-divider">
                    <div class="form-divider-line"></div>
                    <span class="form-divider-text">Are you a District Authority?</span>
                    <div class="form-divider-line"></div>
                </div>

                <a href="authority-login.html" class="btn btn-secondary btn-lg"
                    style="width: 100%; text-align: center; text-decoration: none;">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path>
                        <path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path>
                        <path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path>
                    </svg>
                    <span>Authority Login</span>
                </a>

                <p class="login-footer">Protected by Tamil Nadu Government • Secure & Verified</p>
            </div>
        </div>
    </div>

    <script>
        function handleTouristLogin(e) {
            e.preventDefault();
            sessionStorage.setItem('userRole', 'tourist');
            window.location.href = 'home.html';
        }

        function handleGoogleLogin() {
            sessionStorage.setItem('userRole', 'tourist');
            window.location.href = 'home.html';
        }
    </script>
</body>

</html>
