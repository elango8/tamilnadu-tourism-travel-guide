<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts - Tamil Nadu Tourism</title>
    <meta name="description" content="Official alerts from district authorities.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>
    <div class="page-header">
        <div class="container">
            <div class="page-header-inner">
                <a href="home.html" class="back-btn">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m12 19-7-7 7-7"></path>
                        <path d="M19 12H5"></path>
                    </svg>
                </a>
                <div class="flex-1">
                    <h1 class="page-title">Active Alerts</h1>
                    <p class="page-subtitle">Official updates from district authorities</p>
                </div>
                <span class="badge badge-danger" id="high-alert-count">2 High Priority</span>
            </div>
        </div>
    </div>

    <div class="container py-6">
        <div class="flex flex-col gap-4" id="alerts-list"></div>

        <!-- Info Banner -->
        <div class="info-box info-box-info mt-6">
            <svg class="icon" style="color: var(--color-primary); flex-shrink: 0;" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
                <path d="M12 9v4"></path>
                <path d="M12 17h.01"></path>
            </svg>
            <div>
                <h4 class="font-semibold mb-1">Stay Informed & Safe</h4>
                <p class="text-sm text-gray-600">All alerts are issued and verified by respective District Authorities.
                    We recommend checking alerts before visiting any tourist destination.</p>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script>
        // Check authentication
        if (!sessionStorage.getItem('userRole')) {
            window.location.href = 'login.html';
        }

        function getSeverityBadgeClass(severity) {
            switch (severity) {
                case 'high': return 'badge-danger';
                case 'medium': return 'badge-warning';
                case 'low': return 'badge-info';
                default: return 'badge-info';
            }
        }

        function getAlertIcon(type) {
            switch (type) {
                case 'weather':
                    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>`;
                case 'crowd':
                    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>`;
                case 'maintenance':
                    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="8" x="2" y="6" rx="1"></rect><path d="M17 14v7"></path><path d="M7 14v7"></path></svg>`;
                default:
                    return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>`;
            }
        }

        // Render alerts
        const list = document.getElementById('alerts-list');
        const highCount = alerts.filter(a => a.severity === 'high').length;
        document.getElementById('high-alert-count').textContent = `${highCount} High Priority`;

        list.innerHTML = alerts.map(alert => `
      <div class="alert-item ${alert.severity}">
        <div class="alert-icon">
          ${getAlertIcon(alert.type)}
        </div>
        <div class="alert-content">
          <div class="alert-header">
            <h3 class="alert-title">${alert.title}</h3>
            <span class="badge ${getSeverityBadgeClass(alert.severity)}">${alert.severity.toUpperCase()}</span>
          </div>
          <div class="alert-location">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            ${alert.location}
          </div>
          <p class="alert-message">${alert.message}</p>
          <div class="alert-footer">
            <span class="flex items-center gap-2">
              <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              ${alert.timestamp}
            </span>
            <span>Issued by: <strong>${alert.issuer}</strong></span>
          </div>
        </div>
      </div>
    `).join('');
    </script>
</body>

</html>
