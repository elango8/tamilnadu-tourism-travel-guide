<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>District Details - Tamil Nadu Tourism</title>
    <meta name="description" content="Explore district details and tourist places.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>
    <div class="detail-hero">
        <img class="detail-hero-img" id="district-detail-img" src="" alt="">
        <div class="detail-hero-overlay"></div>
        <a href="districts.html" class="detail-hero-back">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m12 19-7-7 7-7"></path>
                <path d="M19 12H5"></path>
            </svg>
        </a>
        <div class="detail-hero-content container">
            <div class="detail-hero-badges">
                <span class="badge badge-info">
                    <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    Tamil Nadu
                </span>
                <span class="badge badge-success" id="district-detail-season"></span>
            </div>
            <h1 id="district-detail-name"></h1>
        </div>
    </div>

    <div class="container py-6">
        <!-- Info Cards -->
        <div class="grid grid-3 mb-6">
            <div class="info-box info-box-info">
                <div class="info-box-icon">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                <div>
                    <h3 class="font-semibold mb-1">About</h3>
                    <p class="text-sm text-gray-600" id="district-detail-desc"></p>
                </div>
            </div>

            <div class="info-box info-box-success">
                <div class="info-box-icon">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect width="18" height="18" x="3" y="4" rx="2" ry="2"></rect>
                        <line x1="16" x2="16" y1="2" y2="6"></line>
                        <line x1="8" x2="8" y1="2" y2="6"></line>
                        <line x1="3" x2="21" y1="10" y2="10"></line>
                    </svg>
                </div>
                <div>
                    <h3 class="font-semibold mb-1">Best Season</h3>
                    <p class="text-sm text-gray-600" id="district-detail-best-season"></p>
                </div>
            </div>

            <div class="info-box info-box-warning">
                <div class="info-box-icon">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z">
                        </path>
                        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"></path>
                    </svg>
                </div>
                <div>
                    <h3 class="font-semibold mb-1">Cultural Notes</h3>
                    <p class="text-sm text-gray-600" id="district-detail-culture"></p>
                </div>
            </div>
        </div>

        <!-- Tourist Places -->
        <div class="mb-6">
            <h2 class="text-2xl font-semibold mb-2">Top Tourist Places</h2>
            <p class="text-gray-600 mb-4">Live status updates from district authorities</p>
            <div class="grid grid-2" id="district-places-grid"></div>
        </div>

        <!-- Trust Badge -->
        <div class="info-box info-box-success">
            <div class="info-box-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div>
                <h4 class="font-semibold mb-1">Verified & Updated by District Authority</h4>
                <p class="text-sm text-gray-600">All information is official and monitored in real-time</p>
            </div>
        </div>
    </div>

    <!-- AI FAB -->
    <button class="ai-fab" onclick="toggleChatPopup()" title="AI Travel Friend">
        <svg class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8V4H8"></path>
            <rect width="16" height="12" x="4" y="8" rx="2"></rect>
            <path d="M2 14h2"></path>
            <path d="M20 14h2"></path>
            <path d="M15 13v2"></path>
            <path d="M9 13v2"></path>
        </svg>
    </button>

    <!-- Chat Popup -->
    <div id="chat-popup-overlay" class="chat-popup-overlay" onclick="closeChatPopupOnOverlay(event)">
        <div class="chat-popup">
            <div class="chat-header">
                <div class="chat-header-inner">
                    <div class="chat-avatar">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 8V4H8"></path>
                            <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                        </svg>
                    </div>
                    <div class="chat-title">
                        <h1>AI Travel Friend</h1>
                        <p><span class="chat-status-dot"></span> Always here to help</p>
                    </div>
                    <button class="chat-close-btn" onclick="toggleChatPopup()">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18"></path>
                            <path d="m6 6 12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-prompts" id="chat-prompts">
                <p class="chat-prompts-title">Suggested:</p>
                <div class="chat-prompts-grid">
                    <button class="chat-prompt-btn" onclick="sendSuggestedPrompt('Is Marina Beach safe?')">Marina Beach
                        safe?</button>
                    <button class="chat-prompt-btn" onclick="sendSuggestedPrompt('Less crowded places')">Less
                        crowded</button>
                </div>
            </div>
            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <input type="text" class="chat-input" id="chat-input" placeholder="Ask about Tamil Nadu..."
                        onkeypress="handleChatKeypress(event)">
                    <button class="chat-send-btn" id="chat-send-btn" onclick="sendChatMessage()">
                        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" x2="11" y1="2" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/chat.js"></script>
    <script>
        // Check authentication
        if (!sessionStorage.getItem('userRole')) {
            window.location.href = 'login.html';
        }

        // Get district from URL
        const urlParams = new URLSearchParams(window.location.search);
        const districtName = urlParams.get('name') || 'Chennai';
        const data = districtData[districtName] || districtData['Chennai'];

        // Render district details
        document.getElementById('district-detail-img').src = data.image;
        document.getElementById('district-detail-name').textContent = districtName;
        document.getElementById('district-detail-season').textContent = data.bestSeason;
        document.getElementById('district-detail-desc').textContent = data.description;
        document.getElementById('district-detail-best-season').textContent = data.bestSeason;
        document.getElementById('district-detail-culture').textContent = data.culture;
        document.title = `${districtName} - Tamil Nadu Tourism`;

        function getCrowdBadgeClass(level) {
            switch (level) {
                case 'Low': return 'badge-success';
                case 'Medium': return 'badge-warning';
                case 'High': return 'badge-danger';
                default: return 'badge-info';
            }
        }

        function getStatusIcon(status) {
            switch (status) {
                case 'Open': return `<svg class="icon-sm" style="color: var(--color-success);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
                case 'Limited': return `<svg class="icon-sm" style="color: var(--color-warning);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>`;
                case 'Closed': return `<svg class="icon-sm" style="color: var(--color-danger);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>`;
                default: return '';
            }
        }

        function getStatusColor(status) {
            switch (status) {
                case 'Open': return 'var(--color-success)';
                case 'Limited': return 'var(--color-warning)';
                case 'Closed': return 'var(--color-danger)';
                default: return 'var(--color-gray-600)';
            }
        }

        // Render places
        const placesGrid = document.getElementById('district-places-grid');
        placesGrid.innerHTML = data.places.map(place => `
      <a href="place-detail.html?name=${encodeURIComponent(place.name)}&district=${encodeURIComponent(districtName)}" class="place-card" style="text-decoration: none; color: inherit;">
        <div class="place-card-header">
          <div>
            <h3 class="place-card-title">${place.name}</h3>
            <div class="place-card-status">
              ${getStatusIcon(place.status)}
              <span style="color: ${getStatusColor(place.status)}">${place.status}</span>
            </div>
          </div>
          <span class="badge ${getCrowdBadgeClass(place.crowd)}">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
            </svg>
            ${place.crowd}
          </span>
        </div>
        <div class="place-card-meta">
          <span class="flex items-center gap-1">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
            </svg>
            ${place.weather}
          </span>
          <span class="text-gray-500" style="font-size: 12px;">Updated 15 min ago</span>
        </div>
        <div class="place-card-link">
          <span>View Details</span>
          <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m9 18 6-6-6-6"></path>
          </svg>
        </div>
      </a>
    `).join('');

        // Chat Popup
        let chatPopupOpen = false;
        function toggleChatPopup() {
            const overlay = document.getElementById('chat-popup-overlay');
            chatPopupOpen = !chatPopupOpen;
            if (chatPopupOpen) {
                overlay.classList.add('active');
                initChat();
                document.body.style.overflow = 'hidden';
            } else {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        }
        function closeChatPopupOnOverlay(e) {
            if (e.target.id === 'chat-popup-overlay') toggleChatPopup();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && chatPopupOpen) toggleChatPopup();
        });
    </script>
</body>

</html>
